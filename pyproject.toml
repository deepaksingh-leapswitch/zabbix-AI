[project]
name = "zabbix-ai"
version = "1.3.0"
description = "AI-assisted root-cause analysis for Zabbix monitoring"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "anthropic>=0.39",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "qrcode>=7.4",
    "Authlib>=1.3",
    "jinja2>=3.1",
    "sse-starlette>=2.1",
    "pyotp>=2.9",
    "itsdangerous>=2.2",
    "bcrypt>=4.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
zabbix-ai = "zabbix_ai.adapters.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zabbix_ai"]

[tool.hatch.build.targets.wheel.force-include]
"zabbix_ai/templates" = "zabbix_ai/templates"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff.lint.per-file-ignores]
"zabbix_ai/admin/routes/*.py" = ["B008"]
