# zabbix-rca-AI — Linux agent AllowKey block
# ─────────────────────────────────────────────────────────────────────────────
# Drop this file at:
#   /etc/zabbix/zabbix_agent2.d/zabbix-ai-diag.conf
# Then:
#   sudo systemctl restart zabbix-agent2
#
# This file enables the zabbix-rca-AI diag global scripts on Linux hosts.
# The AI calls `script.execute` on the Zabbix server, which sends
# `system.run[<command>]` to the agent. Each AllowKey below matches the
# exact command body registered by services/script_bootstrap.py (Linux
# variant). Order matters: AllowKey/DenyKey are evaluated top-to-bottom —
# DenyKey=system.run[*] MUST be last.
#
# Prerequisites (Server= / TLS PSK / firewall) are described in
# docs/AGENT-SETUP.md §2 and §9. This file assumes they're already in place.
# ─────────────────────────────────────────────────────────────────────────────

# ── short single-command diags (literal AllowKey) ──
AllowKey=system.run[df -hP]
AllowKey=system.run[free -m]
AllowKey=system.run[uptime]
AllowKey=system.run[top -bn1 2>/dev/null | head -30]
AllowKey=system.run[dmesg -T 2>/dev/null | tail -100]
AllowKey=system.run[ss -tunap 2>/dev/null]
AllowKey=system.run[ps auxf --sort=-%mem 2>/dev/null | head -40]
AllowKey=system.run[iostat -xz 1 2 2>/dev/null]
AllowKey=system.run[mysqladmin --defaults-file=/etc/zabbix/.my.cnf status 2>/dev/null]
AllowKey=system.run[mysql --defaults-file=/etc/zabbix/.my.cnf -e 'SHOW FULL PROCESSLIST' 2>/dev/null]
AllowKey=system.run[curl -s http://127.0.0.1/server-status?auto 2>/dev/null]
AllowKey=system.run[echo '=== filesystems ==='; df -hP 2>/dev/null; echo; echo '=== top 40 dirs by size (depth 3, max 30s) ==='; timeout 30 du -hxd 3 / 2>/dev/null | sort -hr | head -40]

# ── v1.5.3: MariaDB / config / large-file diags (Linux-only) ──
AllowKey=system.run[mysql --defaults-file=/etc/zabbix/.my.cnf -e "SELECT @@version AS version, @@hostname AS host\G SHOW GLOBAL VARIABLES WHERE Variable_name IN ('innodb_buffer_pool_size','innodb_buffer_pool_instances','innodb_log_file_size','innodb_log_buffer_size','innodb_io_capacity','innodb_io_capacity_max','innodb_flush_log_at_trx_commit','innodb_file_per_table','tmp_table_size','max_heap_table_size','max_connections','max_user_connections','thread_cache_size','table_open_cache','table_definition_cache','sort_buffer_size','join_buffer_size','read_buffer_size','query_cache_type','query_cache_size','slow_query_log','long_query_time','log_bin','expire_logs_days','binlog_format','sync_binlog');" 2>/dev/null]
AllowKey=system.run[mysql --defaults-file=/etc/zabbix/.my.cnf -e "SELECT TABLE_SCHEMA, TABLE_NAME, TABLE_ROWS, ROUND(DATA_LENGTH/1024/1024/1024,2) AS data_gb, ROUND(INDEX_LENGTH/1024/1024/1024,2) AS index_gb FROM information_schema.tables WHERE TABLE_SCHEMA NOT IN ('mysql','information_schema','performance_schema','sys') ORDER BY (DATA_LENGTH+INDEX_LENGTH) DESC LIMIT 25;" 2>/dev/null; echo '=== InnoDB system files ==='; ls -lh /var/lib/mysql/ib* 2>/dev/null]
AllowKey=system.run[mysql --defaults-file=/etc/zabbix/.my.cnf -N -B -e "SELECT VARIABLE_NAME, VARIABLE_VALUE FROM information_schema.global_status WHERE VARIABLE_NAME IN ('Innodb_buffer_pool_reads','Innodb_buffer_pool_read_requests','Created_tmp_disk_tables','Created_tmp_tables','Threads_running','Threads_connected','Slow_queries','Uptime','Innodb_buffer_pool_pages_data','Innodb_buffer_pool_pages_free','Innodb_buffer_pool_pages_dirty','Aborted_connects');" 2>/dev/null | awk 'BEGIN{FS="\t"} {v[$1]=$2} END{print "=== raw counters ==="; for(k in v) printf "%s: %s\n", k, v[k]; print ""; print "=== derived ratios ==="; rr=v["Innodb_buffer_pool_read_requests"]+0; r=v["Innodb_buffer_pool_reads"]+0; if(rr>0) printf "buffer_pool_hit_ratio: %.4f%%\n", (1-r/rr)*100; ct=v["Created_tmp_tables"]+0; cd=v["Created_tmp_disk_tables"]+0; if(ct>0) printf "tmp_tables_in_memory_ratio: %.2f%%\n", (1-cd/ct)*100; pd=v["Innodb_buffer_pool_pages_data"]+0; pf=v["Innodb_buffer_pool_pages_free"]+0; pdirty=v["Innodb_buffer_pool_pages_dirty"]+0; total=pd+pf; if(total>0) printf "buffer_pool_fill: %.1f%%, dirty: %.1f%%\n", 100*pd/total, 100*pdirty/total; u=v["Uptime"]+0; sl=v["Slow_queries"]+0; if(u>0) printf "slow_queries_per_hour: %.1f\n", sl*3600/u}']
AllowKey=system.run[find / -xdev -type f -size +500M -printf '%s\t%p\n' 2>/dev/null | sort -rn | head -30 | awk 'BEGIN{print "size_gb\tpath"} {printf "%.2fG\t%s\n", $1/1024/1024/1024, $2}']

# ── parameterised diags ({MANUALINPUT} substituted server-side; the
#    server-side regex validator in tools/diag.py constrains the input) ──
AllowKey=system.run[systemctl status *]
AllowKey=system.run[journalctl -n *]
# diag.read_config — path is constrained by the server-side _CONFIG_PATH_RE
# regex (in tools/diag.py) and re-validated by Zabbix manualinput regex.
# `head -200` is read-only so the wildcard is acceptable here.
AllowKey=system.run[head -200 *]

# ── long bodies (diag.snapshot, diag.mail_queue, diag.network,
#    diag.cert_expiry, diag.smart) — see docs/AGENT-SETUP.md §3c
#    for the wrapper-script alternative, OR use this permissive line
#    if the host is PSK-locked and firewalled to the Zabbix server only: ──
# AllowKey=system.run[*]

# ── defense in depth: deny everything not explicitly allowed above ──
DenyKey=system.run[*]

# Required for the longer diags (mail-queue scan, iostat 2-sample):
Timeout=30
