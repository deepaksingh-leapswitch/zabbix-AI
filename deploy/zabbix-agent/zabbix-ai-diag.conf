# zabbix-rca-AI — Linux agent AllowKey block
# ─────────────────────────────────────────────────────────────────────────────
# Drop this file at:
#   /etc/zabbix/zabbix_agent2.d/zabbix-ai-diag.conf
# Then:
#   sudo systemctl restart zabbix-agent2
#
# This file enables the zabbix-rca-AI diag global scripts on Linux hosts.
# The AI calls `script.execute` on the Zabbix server, which sends
# `system.run[<command>]` to the agent. Each AllowKey below matches the
# exact command body registered by services/script_bootstrap.py (Linux
# variant). Order matters: AllowKey/DenyKey are evaluated top-to-bottom —
# DenyKey=system.run[*] MUST be last.
#
# Prerequisites (Server= / TLS PSK / firewall) are described in
# docs/AGENT-SETUP.md §2 and §9. This file assumes they're already in place.
# ─────────────────────────────────────────────────────────────────────────────

# ── short single-command diags (literal AllowKey) ──
AllowKey=system.run[df -hP]
AllowKey=system.run[free -m]
AllowKey=system.run[uptime]
AllowKey=system.run[top -bn1 2>/dev/null | head -30]
AllowKey=system.run[dmesg -T 2>/dev/null | tail -100]
AllowKey=system.run[ss -tunap 2>/dev/null]
AllowKey=system.run[ps auxf --sort=-%mem 2>/dev/null | head -40]
AllowKey=system.run[iostat -xz 1 2 2>/dev/null]
AllowKey=system.run[mysqladmin --defaults-file=/etc/zabbix/.my.cnf status 2>/dev/null]
AllowKey=system.run[mysql --defaults-file=/etc/zabbix/.my.cnf -e 'SHOW FULL PROCESSLIST' 2>/dev/null]
AllowKey=system.run[curl -s http://127.0.0.1/server-status?auto 2>/dev/null]

# ── parameterised diags ({MANUALINPUT} substituted server-side; the
#    server-side regex validator in tools/diag.py constrains the input) ──
AllowKey=system.run[systemctl status *]
AllowKey=system.run[journalctl -n *]

# ── long bodies (diag.snapshot, diag.mail_queue, diag.network,
#    diag.cert_expiry, diag.smart) — see docs/AGENT-SETUP.md §3c
#    for the wrapper-script alternative, OR use this permissive line
#    if the host is PSK-locked and firewalled to the Zabbix server only: ──
# AllowKey=system.run[*]

# ── defense in depth: deny everything not explicitly allowed above ──
DenyKey=system.run[*]

# Required for the longer diags (mail-queue scan, iostat 2-sample):
Timeout=30
