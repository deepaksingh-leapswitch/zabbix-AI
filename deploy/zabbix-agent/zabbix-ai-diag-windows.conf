# zabbix-rca-AI — Windows agent AllowKey block
# ─────────────────────────────────────────────────────────────────────────────
# Drop this file at:
#   C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\zabbix-ai-diag.conf
# (Create the zabbix_agent2.d folder if it doesn't exist.)
# Then, in an elevated PowerShell:
#   Restart-Service "Zabbix Agent 2"
#
# Why a wildcard? Every Windows diag is wrapped by _ps_encoded() in
# services/script_bootstrap.py and ships as a single line:
#   powershell -NoProfile -OutputFormat Text -EncodedCommand <600+ char base64>
# Putting a literal AllowKey per diag would be 15+ lines of unreadable
# base64 and would re-break every time we update a script. The wildcard
# below is the pragmatic choice IF the host is properly locked down:
#
#   1. Server=<single Zabbix server IP>   (no CIDR, no wildcard)
#   2. TLS PSK active (TLSConnect=psk, TLSAccept=psk)
#   3. Windows Firewall: TCP/10050 inbound allowed only from the Zabbix
#      server IP
#
# With those three in place, only the Zabbix server can talk to this
# agent, and zabbix-rca-AI pins what scripts exist on the server side.
# An attacker who could somehow run system.run[powershell ...] on this
# agent has already breached the Zabbix server itself — a tier-0 event
# where AllowKey discipline isn't the relevant control anyway.
#
# If your environment can't meet those three prerequisites, use the
# wrapper-script alternative documented in docs/AGENT-SETUP.md §4a.
# ─────────────────────────────────────────────────────────────────────────────

# ── PowerShell wildcard covers all v1.0-v1.4 Windows diag bodies ──
AllowKey=system.run[powershell*]

# ── parameterised diags ({MANUALINPUT} resolves before the agent sees it) ──
# These are short PowerShell -Command strings, not -EncodedCommand, so they
# match the wildcard above. Kept here for documentation:
#   diag.systemctl_status  -> Get-Service '{MANUALINPUT}' | Format-List ...
#   diag.journal_tail      -> Get-EventLog System -Newest {MANUALINPUT} | ...

# ── defense in depth: deny everything not explicitly allowed above ──
DenyKey=system.run[*]

# Some diags (mail-queue scan, network probes) can take 20+ seconds.
Timeout=30
